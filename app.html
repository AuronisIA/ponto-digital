<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Ponto Digital</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
  <link rel="icon" type="image/png" sizes="192x192" href="icone-192.png">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Ponto">
  <meta name="theme-color" content="#0a2668">
  <style>
    html, body { margin: 0; height: 100%; background: #0a2668; overflow: hidden; }
    /* O app do Google ocupa a tela inteira. "allow" libera a localização para o ponto. */
    iframe { position: fixed; inset: 0; width: 100%; height: 100%; border: 0; background: #eef2f8; }
    .carregando { position: fixed; inset: 0; display: grid; place-items: center; color: #fff;
      font: 600 16px system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
    .carregando img { width: 72px; height: 72px; border-radius: 18px; display: block; margin: 0 auto 12px; }
  </style>
</head>
<body>
  <div class="carregando"><div><img src="icone-192.png" alt="">Carregando o ponto…</div></div>
  <iframe id="app" title="Ponto Digital" allow="geolocation; clipboard-write"
          referrerpolicy="strict-origin-when-cross-origin"></iframe>
  <script>
    /* Mesmo link do app usado no index.html */
    var APP_URL = 'https://script.google.com/macros/s/AKfycbzbzN86HW7zRTNWF9QWmtuHPZ9cVRMIBqO1KgrKaseTdRoBXlg8vuyUy_HfUVrWBV4f/exec';
    var f = document.getElementById('app');
    // Repassa ?p=admin para abrir o painel do gestor, se pedido.
    var p = new URLSearchParams(location.search).get('p');
    f.src = APP_URL + (p === 'admin' ? '?p=admin' : '');
  </script>
</body>
</html>
